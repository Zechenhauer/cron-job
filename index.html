<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronjob-Steuerung (120 Min. Auto-Aus)</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --border: #263248;
      --gold: #d4af37;
      --green: #00ff87;
      --red: #ff4d4d;
      --blue: #38bdf8;
      --text: #f3f6fa;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 18px; display: flex; justify-content: center; }
    .wrap { width: 100%; max-width: 780px; }
    h1 { color: var(--gold); font-size: 1.5rem; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    input { width: 100%; background: #0b0f17; border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 0.9rem; }
    button { background: #1e293b; color: var(--text); border: 1px solid var(--border); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
    button:hover { border-color: var(--gold); }
    .btn-start { background: rgba(0, 255, 135, 0.14); border-color: var(--green); color: var(--green); }
    .btn-stop { background: rgba(255, 77, 77, 0.14); border-color: var(--red); color: #ff8080; }
    .btn-gold { background: var(--gold); color: #000; border-color: var(--gold); }
    .btn-push { background: rgba(56, 189, 248, 0.14); border-color: var(--blue); color: #7dd3fc; }
    .job-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .job-row:last-child { border-bottom: none; }
    .badge-on { color: var(--green); font-weight: 700; font-size: 0.82rem; }
    .badge-off { color: var(--muted); font-weight: 700; font-size: 0.82rem; }
    .timer-info { color: var(--gold); font-size: 0.82rem; margin-top: 3px; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .msg { font-size: 0.84rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⏱️ Bundesliga Live-Cronjobs (120 Min.)</h1>
    <div class="sub">Startet den jeweiligen Job in cron-job.org und schaltet ihn nach 120 Minuten automatisch ab.</div>

    <div class="card">
      <div class="bar">
        <strong>⚙️ Worker & Job-IDs</strong>
        <button class="btn-gold" onclick="saveConfig()">Speichern & Laden</button>
      </div>
      <div style="margin-top: 10px;">
        <label>Worker-URL (cron-manager)</label>
        <input id="workerUrl" value="https://cron-manager.jelenbreaker.workers.dev" />
      </div>
      <div class="grid-3">
        <div>
          <label>Job-ID 1. Liga (?league=78)</label>
          <input id="jobId78" placeholder="wird automatisch erkannt" />
        </div>
        <div>
          <label>Job-ID 2. Liga (?league=79)</label>
          <input id="jobId79" placeholder="wird automatisch erkannt" />
        </div>
        <div>
          <label>Job-ID 3. Liga (?league=80)</label>
          <input id="jobId80" placeholder="wird automatisch erkannt" />
        </div>
      </div>
      <div class="msg" id="statusMsg">Lade Status...</div>
    </div>

    <div class="card">
      <div class="bar" style="margin-bottom: 6px;">
        <strong>📋 Deine 3 Live-Jobs</strong>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn-push" onclick="sendTestPush()">📲 Test-Push</button>
          <button onclick="refreshStatus()">🔄 Aktualisieren</button>
        </div>
      </div>
      <div id="jobsContainer">Lade Jobs...</div>
    </div>
  </div>

  <script>
    const DEFAULT_WORKER = "https://cron-manager.jelenbreaker.workers.dev";
    const cfg = JSON.parse(localStorage.getItem("liga_cron_mgr_cfg") || "{}");
    document.getElementById("workerUrl").value = cfg.workerUrl || DEFAULT_WORKER;
    document.getElementById("jobId78").value = cfg.jobId78 || "";
    document.getElementById("jobId79").value = cfg.jobId79 || "";
    document.getElementById("jobId80").value = cfg.jobId80 || "";

    function getConfig() {
      return {
        workerUrl: (document.getElementById("workerUrl").value.trim() || DEFAULT_WORKER).replace(/\/+$/, ""),
        jobId78: document.getElementById("jobId78").value.trim(),
        jobId79: document.getElementById("jobId79").value.trim(),
        jobId80: document.getElementById("jobId80").value.trim()
      };
    }

    function saveConfig() {
      const current = getConfig();
      localStorage.setItem("liga_cron_mgr_cfg", JSON.stringify(current));
      setMsg("Einstellungen gespeichert.");
      refreshStatus();
    }

    function setMsg(text) {
      document.getElementById("statusMsg").textContent = text;
    }

    async function sendTestPush() {
      const c = getConfig();
      setMsg("Sende Test-Push an push_subscriptions_msv...");
      try {
        const res = await fetch(c.workerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "testPush" })
        });
        const out = await res.json();
        if (!res.ok) {
          setMsg("Test-Push Fehler (" + res.status + "): " + (out.response || out.error || ""));
          return;
        }
        setMsg("Test-Push gesendet (HTTP " + out.status + ") – bitte Handy prüfen.");
      } catch (err) {
        setMsg("Netzwerkfehler beim Test-Push: " + err.message);
      }
    }

    async function refreshStatus() {
      const c = getConfig();
      try {
        const res = await fetch(`${c.workerUrl}/?action=status`);
        const data = await res.json();
        const jobs = data.jobs || [];
        const timers = data.timers || [];
        const matched = data.matchedJobIds || {};

        if (!c.jobId78 && matched.bl1) {
          c.jobId78 = String(matched.bl1);
          document.getElementById("jobId78").value = c.jobId78;
        }
        if (!c.jobId79 && matched.liga2) {
          c.jobId79 = String(matched.liga2);
          document.getElementById("jobId79").value = c.jobId79;
        }
        if (!c.jobId80 && matched.msv) {
          c.jobId80 = String(matched.msv);
          document.getElementById("jobId80").value = c.jobId80;
        }
        localStorage.setItem("liga_cron_mgr_cfg", JSON.stringify(c));

        const targets = [
          { label: "Live Spiele 1. Liga", id: c.jobId78 },
          { label: "Live Spiele 2. Liga", id: c.jobId79 },
          { label: "Live-Tore 3. Liga", id: c.jobId80 }
        ];

        const container = document.getElementById("jobsContainer");
        container.innerHTML = "";

        for (const t of targets) {
          const apiJob = jobs.find(j => String(j.jobId) === String(t.id));
          const timer = timers.find(tm => String(tm.job_id) === String(t.id));
          const isEnabled = apiJob ? Boolean(apiJob.enabled) : false;

          let remainingText = "";
          if (timer && timer.turn_off_at) {
            const diffMin = Math.max(0, Math.round((new Date(timer.turn_off_at).getTime() - Date.now()) / 60000));
            const endClock = new Date(timer.turn_off_at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
            remainingText = `<div class="timer-info">⏳ Auto-Aus um ${endClock} Uhr (noch ca. ${diffMin} Min.)</div>`;
          }

          const row = document.createElement("div");
          row.className = "job-row";
          row.innerHTML = `
            <div>
              <div><strong>${t.label}</strong> <span style="color:var(--muted); font-size:0.8rem;">(ID: ${t.id || "nicht gefunden"})</span></div>
              <div class="${isEnabled ? "badge-on" : "badge-off"}">${isEnabled ? "🟢 AKTIV" : "⚪ INAKTIV"}</div>
              ${remainingText}
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn-start" onclick="controlJob(${t.id || 0}, 'start', '${t.label}')">▶ 120 Min. an</button>
              <button class="btn-stop" onclick="controlJob(${t.id || 0}, 'stop', '${t.label}')">⏹ Aus</button>
            </div>
          `;
          container.appendChild(row);
        }

        setMsg("Status aktualisiert: " + new Date().toLocaleTimeString("de-DE"));
      } catch (err) {
        setMsg("Fehler beim Laden: " + err.message);
      }
    }

    async function controlJob(jobId, action, label) {
      const c = getConfig();
      if (!jobId) {
        alert("Job-ID konnte nicht automatisch erkannt werden – bitte kurz manuell eintragen.");
        return;
      }

      setMsg(action === "start" ? `Starte ${label} für 120 Minuten...` : `Schalte ${label} aus...`);
      try {
        const res = await fetch(c.workerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, jobId: Number(jobId), minutes: 120, label })
        });
        const out = await res.json();
        if (!res.ok) {
          setMsg("Fehler: " + (out.error || res.status));
          return;
        }
        await refreshStatus();
        setMsg(action === "start" ? `${label} für 120 Minuten aktiviert.` : `${label} deaktiviert.`);
      } catch (err) {
        setMsg("Netzwerkfehler: " + err.message);
      }
    }

    refreshStatus();
  </script>
</body>
</html>
